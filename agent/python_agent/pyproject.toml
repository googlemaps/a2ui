[project]
name = "maui-a2ui-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.64.0",
    "a2a-sdk>=0.3.0,<1.0.0",
    # google-adk[extensions,mcp]>=2.0.0 is required for nested Pydantic models in function calling and MCP tools
    "google-adk[extensions,mcp]>=2.0.0",
    "a2ui-agent-sdk>=0.2.1,<=0.2.4",
    "jsonschema>=4.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.391",
    "ruff>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
