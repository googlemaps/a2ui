name: iOS CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: iOS CI / build
    # Pinned to macos-15 for a stable macOS/Xcode major version. The active Xcode
    # and its installed iOS Simulator runtimes can still change between image
    # updates, so the simulator is selected dynamically below.
    # zizmor: ignore[unpinned-images]
    runs-on: macos-15
    # Build and test takes ~11 min; the runtime-download fallback below can add
    # 10+ min on top of that.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show Xcode and iOS Simulator runtimes
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build and test package
        run: |
          set -euo pipefail

          # See the script's docstring for its exit codes.
          SELECT_SIMULATOR="$GITHUB_WORKSPACE/.github/scripts/select_simulator.py"

          status=0
          SIMULATOR_ID=$(python3 "$SELECT_SIMULATOR") || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::No iOS Simulator runtime installed for the active Xcode; downloading one (slow)."
            if ! xcodebuild -downloadPlatform iOS; then
              echo "::error::Failed to download an iOS Simulator runtime for the active Xcode."
              exit 1
            fi
            status=0
            SIMULATOR_ID=$(python3 "$SELECT_SIMULATOR") || status=$?
          fi
          case "$status" in
            0) ;;
            2)
              echo "::error::No iOS Simulator runtime usable by the active Xcode is available on this runner; refusing to test on a non-iOS destination."
              xcrun simctl list runtimes
              exit 1
              ;;
            3)
              echo "::error::The selected iOS Simulator runtime has no iPhone device type to create a simulator from."
              xcrun simctl list devicetypes
              exit 1
              ;;
            *)
              echo "::error::iOS Simulator selection failed (exit code $status); see the log above."
              exit 1
              ;;
          esac

          echo "Using iOS Simulator UDID: $SIMULATOR_ID"
          # xcodebuild boots the destination simulator itself.
          xcodebuild test \
            -scheme GoogleMapsA2UI \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
        working-directory: client/ios/GoogleMapsA2UI
